
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Список товарів</h2>

    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-3">
            <div class="card p-3 h-100">
                <h3>{{ product.name }}</h3>
                <p>Ціна: {{ product.price }} грн</p>
                <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                   class="btn btn-primary">
                    Детальніше
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
