{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{{ post.title }}</h1>

    <p>{{ post.content }}</p>
    <p>Автор: {{ post.author }}</p>
    <p>Статус: {{ "Активна" if post.is_active else "Неактивна" }}</p>

    <a href="{{ url_for('posts.update', id=post.id) }}">Редагувати</a>
    <a href="{{ url_for('posts.index') }}">Назад до списку</a>

    <form action="{{ url_for('posts.delete', id=post.id) }}" method="POST">
        <button type="submit">Видалити</button>
    </form>
</div>
{% endblock %}
